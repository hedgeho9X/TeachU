<!DOCTYPE html>
<html>
<head>
    <title>可编辑的Mermaid思维导图</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.min.js"></script>    <style>
        #editor {
            width: 100%;
            height: 200px;
            font-family: monospace;
        }
        #diagram {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        button {
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Mermaid.js 思维导图编辑器</h1>
    
    <textarea id="editor" placeholder="在此输入Mermaid代码...">
mindmap
  Root(我的项目)
    功能需求
      用户登录
      数据展示
      报表生成
    技术选型
      前端框架
      后端语言
      数据库
    </textarea>
    
    <button onclick="updateDiagram()">更新图表</button>
    
    <div id="diagram" class="mermaid"></div>

    <script>
        // 初始化Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'forest'
        });
        
        // 首次渲染
        updateDiagram();
        
        function updateDiagram() {
            const code = document.getElementById('editor').value;
            const container = document.getElementById('diagram');
            
            // 清空容器并创建新的渲染节点
            container.innerHTML = `<div class="mermaid">${code}</div>`;
            
            try {
                // 使用run方法触发重新渲染
                mermaid.run({
                    nodes: [container.querySelector('.mermaid')]
                });
            } catch (err) {
                console.error('渲染失败:', err);
                container.innerHTML = `<div style="color:red">${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
