<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSpark 邮箱验证码</title>
    <style>
        /* 添加一些基本样式重置和全局字体 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background-color: #f0f2f5; /* 更柔和的背景色 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container {
            max-width: 580px; /* 稍微调整宽度 */
            margin: 30px auto;
            background-color: #ffffff; /* 白色背景 */
            padding: 40px; /* 增加内边距 */
            border-radius: 10px; /* 更大的圆角 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); /* 添加阴影 */
            border: 1px solid #e9ecef; /* 添加细边框 */
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #e9ecef; /* 添加分割线 */
            padding-bottom: 20px;
        }
        .header h2 {
            color: #343a40; /* 深灰色标题 */
            margin: 0;
            font-size: 28px; /* 增大字体 */
            font-weight: 600;
        }
        .content h3 {
            color: #495057; /* 次要标题颜色 */
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: 500;
        }
        .content p {
            color: #6c757d; /* 正文颜色 */
            line-height: 1.7;
            font-size: 16px; /* 增大正文字体 */
        }
        .verification-code-box {
            background-color: #e9ecef; /* 调整背景色 */
            padding: 18px 25px; /* 调整内边距 */
            margin: 30px 0;
            border-radius: 8px;
            border: none; /* 移除边框 */
            font-size: 28px; /* 增大验证码字体 */
            letter-spacing: 5px; /* 增加字间距 */
            color: #0d6efd; /* 蓝色验证码 */
            font-weight: 700; /* 加粗 */
            text-align: center;
            font-family: 'Courier New', Courier, monospace; /* 使用等宽字体 */
        }
        .notice {
            color: #adb5bd; /* 提示文字颜色 */
            font-size: 14px; /* 调整字体大小 */
            line-height: 1.6;
            margin-top: 20px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid #e9ecef; /* 添加分割线 */
            padding-top: 20px;
        }
        .footer p {
            color: #adb5bd; /* 页脚文字颜色 */
            font-size: 13px; /* 调整字体大小 */
            line-height: 1.5;
        }
        .footer a {
            color: #0d6efd; /* 蓝色链接 */
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>EduSpark</h2>
        </div>

        <div class="content">
            <h3>邮箱验证码</h3>
            <p>您好！</p> <!-- 添加问候语 -->
            <p>您正在申请通过邮箱进行身份验证，您的验证码是：</p>

            <div class="verification-code-box">
                {验证码}
            </div>

            <p class="notice">
                * 此验证码将在 <strong>5分钟</strong> 内失效。<br>
                * 为了您的账户安全，请勿将验证码透露给他人。<br>
                * 如果这不是您本人操作，请忽略此邮件。
            </p>
        </div>

        <div class="footer">
            <p>
                EduSpark &copy; 2024 · 四川轻化工大学<br> 
                如有疑问，请联系 <a href="mailto:{支持邮箱}">{支持邮箱}</a>
            </p>
        </div>
    </div>
</body>
</html>
